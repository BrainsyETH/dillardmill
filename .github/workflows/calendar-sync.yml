# Calls the site's calendar-sync endpoint every 15 minutes: imports Airbnb /
# Hipcamp / VRBO calendars and expires unanswered booking requests.
# Vercel's own cron (vercel.json) runs once a day as a backstop, because the
# Hobby plan does not allow more frequent Vercel crons.
#
# Repository secrets required (Settings → Secrets and variables → Actions):
#   SITE_URL     e.g. https://dillardmill.com
#   CRON_SECRET  same value as the CRON_SECRET env var on Vercel
name: Calendar sync

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger sync
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SITE_URL / CRON_SECRET secrets not set; skipping."
            exit 0
          fi
          curl --fail-with-body -sS --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/calendar-sync"
